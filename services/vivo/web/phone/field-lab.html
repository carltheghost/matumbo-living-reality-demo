<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07121d"><title>maTumbo Field Lab · Integrated Vivo</title>
<style>body{margin:0;background:#07121d;color:#e5f3ef;font:16px/1.6 system-ui,sans-serif}main{max-width:570px;margin:10vh auto;padding:24px}h1{font-size:42px;line-height:1.1}small{color:#99bcb8}a{color:#a3ecd7;display:inline-block;padding:14px 0}#entryStatus{border-left:2px solid #80c8bb;padding-left:14px}</style></head>
<body><main><small>maTUMBO / FIELD LAB / INTEGRATION CANDIDATE</small><h1>One field.<br>All your tools.</h1><p id="entryStatus" role="status">Loading the existing Vivo runtime and its integrated tools. No original download is required.</p><a id="canonicalEntry" href="./index.html">Open the canonical Vivo app</a><noscript>JavaScript is required to run Vivo.</noscript></main>
<script type="module" id="fieldLabAssembler">
// The entry assembles the existing canonical phone document; it does not copy or replace its engine.
const EXTRA_STYLE = "  <style id=\"fieldLabStyles\">\n    #fieldLabExplore {margin:12px 0;min-height:44px}\n    #fieldLabTools {white-space:nowrap}\n    #fieldLabAll {font:14px/1.55 system-ui,sans-serif}\n    #fieldLabAll h3 {font-size:24px;line-height:1.2;margin:10px 0}\n    #fieldLabAll .lab-intro {color:#bacad3;margin:8px 0 18px}\n    #fieldLabAll .lab-build {font:11px/1.5 ui-monospace,monospace;color:#9dcfc9;overflow-wrap:anywhere}\n    #fieldLabAll .lab-filter {width:100%;min-height:46px;box-sizing:border-box;padding:10px 12px;margin:12px 0;border:1px solid #426573;border-radius:10px;background:#0c202c;color:#ecf5f3}\n    #fieldLabAll .lab-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n    #fieldLabAll .lab-card {text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:7px;padding:14px;min-height:130px;white-space:normal;border:1px solid #385867;background:#102733;border-radius:12px;color:#e7f5f3;font:inherit}\n    #fieldLabAll .lab-card strong {font-size:15px}\n    #fieldLabAll .lab-card span {font-size:12px;color:#b5cbd2}\n    #fieldLabAll .lab-card small {font:10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.05em;color:#a9e3d2}\n    #fieldLabAll .lab-card:disabled {opacity:.55;cursor:not-allowed}\n    #fieldLabAll .lab-card[hidden] {display:none}\n    #fieldLabAll .lab-note {padding:12px;border-left:2px solid #c5b891;background:#192932;color:#d7ded7;font-size:12px;margin-top:16px}\n    #fieldLabAll .lab-links {display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}\n    #fieldLabAll a {color:#ace4d5}\n    #fieldLabAll :focus-visible {outline:3px solid #a6ead9;outline-offset:3px}\n    @media(max-width:380px){#fieldLabAll .lab-grid{grid-template-columns:1fr}}\n  </style>\n";
const TOOL_SHEET = "    <section class=\"sheet\" data-sheet=\"all\" id=\"fieldLabAll\" aria-labelledby=\"fieldLabTitle\">\n      <div class=\"lab-build\">REVIEWED BASE · 1da8a2f · USES THE DEPLOYED VIVO RUNTIME</div>\n      <h3 id=\"fieldLabTitle\">One workspace. Existing implementations.</h3>\n      <p class=\"lab-intro\">These controls open the actual Vivo tools in this world. This is not a second simulation, a file picker, or a set of disconnected demos.</p>\n      <p id=\"fieldLabRuntime\" role=\"status\" aria-live=\"polite\">Enter the local world before using world tools.</p>\n      <label for=\"fieldLabSearch\">Find a tool</label><input id=\"fieldLabSearch\" class=\"lab-filter\" type=\"search\" maxlength=\"80\" placeholder=\"hands, save, agents, contracts…\" autocomplete=\"off\">\n      <div class=\"lab-grid\"><button type=\"button\" class=\"lab-card\" data-lab-action=\"move\" data-lab-search=\"material & movement move, turn, resize and apply local edits.\"><small>Local world</small><strong>Material & movement</strong><span>Move, turn, resize and apply local edits.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"eye\" data-lab-search=\"world eye choose slices and navigate without changing another eye.\"><small>Local world</small><strong>World Eye</strong><span>Choose slices and navigate without changing another Eye.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"atlas\" data-lab-search=\"field atlas inspect coordinate planes, selected objects and accepted history.\"><small>Local world</small><strong>Field atlas</strong><span>Inspect coordinate planes, selected objects and accepted history.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"hands\" data-lab-search=\"camera & two hands local tracking, touch-only preview and explicit camera stop.\"><small>Permission required</small><strong>Camera & two hands</strong><span>Local tracking, touch-only preview and explicit camera stop.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"nested\" data-lab-search=\"nested worlds enter inner worlds and return with the same eye.\"><small>Local world</small><strong>Nested worlds</strong><span>Enter inner worlds and return with the same Eye.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"save\" data-lab-search=\"save & export save the current world and eyes or export an explicit branch.\"><small>Local storage</small><strong>Save & export</strong><span>Save the current world and Eyes or export an explicit branch.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"agents\" data-lab-search=\"agents & grants inspect local tool grants. no agent receives new permission here.\"><small>Explicit grants</small><strong>Agents & grants</strong><span>Inspect local tool grants. No agent receives new permission here.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"exchange\" data-lab-search=\"exchange open the existing local tumbo-sim exchange.\"><small>Simulation only</small><strong>Exchange</strong><span>Open the existing local TUMBO-SIM exchange.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"contracts\" data-lab-search=\"contracts & pools open the existing contracts and local pool tools.\"><small>Simulation only</small><strong>Contracts & pools</strong><span>Open the existing contracts and local pool tools.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"record\" data-lab-search=\"capture & recording scene images and video; camera inclusion stays opt-in.\"><small>Device capability</small><strong>Capture & recording</strong><span>Scene images and video; camera inclusion stays opt-in.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"authority\" data-lab-search=\"authority & sharing inspect explicit mapping/publish controls; a backend is required.\"><small>Backend required</small><strong>Authority & sharing</strong><span>Inspect explicit mapping/publish controls; a backend is required.</span></button><button type=\"button\" class=\"lab-card\" data-lab-action=\"projection\" data-lab-search=\"projection & companion open casting and companion controls without starting capture.\"><small>Device / Companion</small><strong>Projection & Companion</strong><span>Open casting and Companion controls without starting capture.</span></button></div>\n      <p id=\"fieldLabEmpty\" hidden>No matching tools.</p>\n      <p class=\"lab-note\">Scope: merged Vivo phone implementations, not every experiment or unmerged PR. Camera overlay is not anchored AR. Native VR/AR and projection need compatible hardware/software. Sharing needs a running authority. TUMBO-SIM is local simulation, not real funds. Legacy Studio has a different state model and is not automatically imported.</p>\n      <div class=\"lab-links\"><a href=\"./index.html\" id=\"fieldLabCanonical\">Canonical / installed phone app</a><a href=\"../studio.html\" target=\"_blank\" rel=\"noopener\">Preserved Studio</a><a href=\"../../../../index.html\" target=\"_blank\" rel=\"noopener\">Main maTumbo world</a></div>\n      <p class=\"lab-note\">This new entry is an integration candidate. The existing offline installer caches the canonical phone entry above, not this added HTML file. Your existing world and Eye storage keys are unchanged. Do not clear site data.</p>\n    </section>\n    <button data-panel=\"phone\" id=\"fieldLabPhoneBridge\" type=\"button\" hidden aria-hidden=\"true\" tabindex=\"-1\">Advanced local controls</button>\n";
const NAVIGATION = "\n// Navigation only: reuse existing panel handlers, world and permissions.\nconst labConfig = [{\"key\":\"move\",\"panel\":\"move\",\"target\":null,\"needsLocal\":true},{\"key\":\"eye\",\"panel\":\"eye\",\"target\":null,\"needsLocal\":true},{\"key\":\"atlas\",\"panel\":null,\"target\":\"phoneFieldDock\",\"needsLocal\":true},{\"key\":\"hands\",\"panel\":\"camera\",\"target\":null,\"needsLocal\":false},{\"key\":\"nested\",\"panel\":\"phone\",\"target\":\"phoneEnterNested\",\"needsLocal\":true},{\"key\":\"save\",\"panel\":\"phone\",\"target\":\"phonePersist\",\"needsLocal\":true},{\"key\":\"agents\",\"panel\":\"phone\",\"target\":\"phoneAgentTools\",\"needsLocal\":true},{\"key\":\"exchange\",\"panel\":null,\"target\":\"phoneOpenExchange\",\"needsLocal\":true},{\"key\":\"contracts\",\"panel\":null,\"target\":\"phoneOpenContracts\",\"needsLocal\":true},{\"key\":\"record\",\"panel\":\"record\",\"target\":null,\"needsLocal\":true},{\"key\":\"authority\",\"panel\":\"phone\",\"target\":\"phoneAuthorityConnect\",\"needsLocal\":true},{\"key\":\"projection\",\"panel\":\"phone\",\"target\":\"phoneProject\",\"needsLocal\":true}];\nconst labById = id => document.getElementById(id);\nfunction refreshLabTools() {\n  const active = Boolean(window.VivaPhoneEngine?.active);\n  labById('fieldLabRuntime').textContent = active\n    ? 'Local world active · tools use this same world and existing permissions.'\n    : 'Enter the local world first. Camera settings can be inspected without granting access.';\n  for (const item of labConfig) {\n    const button = document.querySelector(`[data-lab-action=\"${item.key}\"]`);\n    button.disabled = item.needsLocal && !active;\n  }\n  filterLabTools();\n}\nfunction filterLabTools() {\n  const query = labById('fieldLabSearch').value.trim().toLowerCase();\n  let visible = 0;\n  for (const card of document.querySelectorAll('[data-lab-action]')) {\n    card.hidden = !card.dataset.labSearch.includes(query);\n    if (!card.hidden) visible++;\n  }\n  labById('fieldLabEmpty').hidden = visible !== 0;\n}\nfor (const id of ['fieldLabTools', 'fieldLabExplore']) {\n  labById(id).addEventListener('click', () => {\n    labById('panelTitle').textContent = 'All Field Lab tools';\n    refreshLabTools();\n  });\n}\nlabById('fieldLabSearch').addEventListener('input', filterLabTools);\nfor (const item of labConfig) {\n  document.querySelector(`[data-lab-action=\"${item.key}\"]`).addEventListener('click', () => {\n    if (item.needsLocal && !window.VivaPhoneEngine?.active) { refreshLabTools(); return; }\n    const target = item.target && labById(item.target);\n    if (item.panel) {\n      const trigger = item.panel === 'phone' ? labById('fieldLabPhoneBridge')\n        : document.querySelector(`#toolbar [data-panel=\"${item.panel}\"]`);\n      if (!trigger || trigger.disabled || typeof trigger.onclick !== 'function') {\n        labById('fieldLabRuntime').textContent = 'The original control is not ready. No action was sent.';\n        return;\n      }\n      trigger.click();\n      if (item.panel === 'phone') labById('panelTitle').textContent = 'Advanced local controls';\n      if (target) requestAnimationFrame(() => target.scrollIntoView({block:'center'}));\n      return;\n    }\n    if (!target || target.disabled) {\n      labById('fieldLabRuntime').textContent = 'This control is unavailable in the current world.';\n      return;\n    }\n    labById('panel').close();\n    if (item.key === 'atlas') target.scrollIntoView({block:'center'});\n    else target.click(); // Existing panel entry only; never a transaction or a permission grant.\n  });\n}\n";
const NATIVE_MODULES = ['./static-shared.js', './bootstrap.mjs', './companion.mjs'];
const REQUIRED_HOOKS = ['world','overlay','cameraVideo','welcome','welcomeTitle','toolbar','panel','panelTitle',
  'phoneFieldDock','phoneFieldEntity','phoneAgentTools','phoneOpenExchange','phoneOpenContracts',
  'phoneEnterNested','phonePersist','phoneAuthorityConnect','phoneProject','recordCamera'];

export function assembleFieldLab(source) {
  if (typeof source !== 'string' || source.length > 250000 || !/^<!doctype html>/i.test(source.trim()))
    throw new Error('The canonical Vivo document is missing or invalid.');
  const modules = [...source.matchAll(/<script type="module" src="([^"]+)"><\/script>/g)].map(match => match[1]);
  if (JSON.stringify(modules) !== JSON.stringify(NATIVE_MODULES))
    throw new Error('The canonical module entry changed. Review this integration before loading it.');
  if (source.includes('id="fieldLabAll"') || source.includes('matumbo-field-lab-v04'))
    throw new Error('This is not the expected native phone document.');
  for (const id of REQUIRED_HOOKS) if (!source.includes(`id="${id}"`))
    throw new Error(`The native control ${id} is unavailable. No alternate engine was started.`);
  const once = (text, before, after) => {
    if (text.split(before).length !== 2) throw new Error('The native entry layout changed; no partial document was loaded.');
    return text.replace(before, after);
  };
  let html = once(source, '<title>Vivo World · Local field</title>', '<title>maTumbo Field Lab · Integrated Vivo</title>');
  html = once(html, '<div><b>Vivo</b><small>LOCAL FIELD / ONE WORLD</small></div>', '<div><b>Field Lab</b><small>VIVO / INTEGRATED WORKSPACE</small></div>');
  html = once(html, '<h1 id="welcomeTitle">Step into<br><em>one world.</em></h1>', '<h1 id="welcomeTitle">One field.<br><em>All your tools.</em></h1>');
  html = once(html, '<p class="welcome-footnote">', '<p class="welcome-footnote">No original HTML download is required. This entry reuses the current Vivo phone runtime. ');
  html = once(html, '<button data-panel="record" type="button">Record</button>', '<button data-panel="record" type="button">Record</button>\n    <button data-panel="all" id="fieldLabTools" type="button">All tools</button>');
  html = once(html, '<span class="eyebrow">LOCAL FIELD / VIVO WORLD</span>', '<span class="eyebrow">maTUMBO / FIELD LAB / INTEGRATION CANDIDATE</span>\n      <button data-panel="all" id="fieldLabExplore" type="button">Explore installed tools</button>');
  html = once(html, '</head>', EXTRA_STYLE + '</head>');
  html = once(html, '  </dialog>', TOOL_SHEET + '  </dialog>');
  return once(html, '</body>', '<script type="module" id="fieldLabNavigation">' + NAVIGATION + '<' + '/script>\n</body>');
}

async function startFieldLab() {
  const note = document.getElementById('entryStatus');
  const fallback = document.getElementById('canonicalEntry');
  const localHost = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  const hosted = location.protocol === 'https:' || (location.protocol === 'http:' && localHost);
  const canonical = hosted ? new URL('./index.html', location.href)
    : new URL('https://carltheghost.github.io/matumbo-living-reality-demo/services/vivo/web/phone/index.html');
  fallback.href = canonical.href;
  if (!hosted) {
    note.textContent = 'This is the new entry source, not the old v0.4 import file. Camera, workers and saved worlds need the hosted app. Open the canonical app below; do not put this file into the old picker.';
    return;
  }
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const response = await fetch(canonical, {cache:'no-cache', credentials:'same-origin', signal:controller.signal});
    if (!response.ok) throw new Error(`The native app returned HTTP ${response.status}.`);
    const type = response.headers.get('content-type') || '';
    if (!type.includes('text/html')) throw new Error('The native app did not return an HTML document.');
    const documentText = assembleFieldLab(await response.text());
    // Preserve the original URL, fragment and origin; all original modules resolve in the phone directory.
    document.open(); document.write(documentText); document.close();
  } catch (error) {
    note.textContent = `Field Lab did not start: ${error instanceof Error ? error.message : 'unknown load error'}. Your saved world was not changed. The canonical app remains available below.`;
  } finally { clearTimeout(timeout); }
}
if (typeof document !== 'undefined') void startFieldLab();

</script></body></html>
