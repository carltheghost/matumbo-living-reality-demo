<!doctype html>
<html><head><meta charset="utf-8"><title>token live check</title></head>
<body><pre id="o">running...</pre>
<script type="module">
import api from "../src/domains/token-boot.js";
const o = document.getElementById("o");
const lines = [];
const say = (m) => lines.push(m);
try {
  const F = api;
  const G = F.ledger;
  say("window.TumboToken present: " + (typeof window.TumboToken !== "undefined"));
  say("execute is function: " + (typeof window.TumboToken.execute === "function"));
  say("invariants: " + G.verifyInvariants());
  say("u:visitor: " + F.balance("u:visitor"));
  say("b:guide: " + F.balance("b:guide"));
  say("b:guide kind: " + G.s.accounts["b:guide"].kind);
  const docEvents = [];
  document.addEventListener("tumbo:token", (e) => docEvents.push(e.detail.type + ":" + (e.detail.txId || e.detail.account)));
  let rc = 0;
  F.on("receipt", () => rc++);
  const k = "live-" + Date.now();
  const r1 = F.execute("send", { from: "u:visitor", to: "b:guide", amountFluff: 500, idem: k });
  const jl = G.s.journal.length;
  const r2 = F.execute("send", { from: "u:visitor", to: "b:guide", amountFluff: 500, idem: k });
  say("txId: " + r1.txId);
  say("replay same tx: " + (r1.txId === r2.txId));
  say("no new journal on replay: " + (G.s.journal.length === jl));
  say("receipt waves (in-process): " + rc);
  say("document events: " + docEvents.length + " [" + docEvents.slice(0, 4).join(", ") + "]");
  say("invariants after: " + G.verifyInvariants());
  say("fmt: " + F.fmt(1500));
} catch (e) {
  say("ERROR " + (e && e.code) + " " + (e && e.message));
}
o.textContent = lines.join("\n");
</script>
</body></html>
