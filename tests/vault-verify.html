<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vault fix verification</title>
<style>body{font-family:ui-monospace,monospace;background:#0a1428;color:#dff1ff;padding:24px;white-space:pre-wrap}</style>
</head>
<body><div id="out">running…</div>
<script type="module">
const lines = [];
const log = (s) => { lines.push(String(s)); document.getElementById('out').textContent = lines.join('\n'); document.title = 'VERIFY ' + String(s).slice(0, 60); };
try {
  const T = await import('https://raw.githack.com/carltheghost/matumbo-living-reality-demo/7945625/src/domains/token.js');
  const v = T.createTokenVaultLedger({ initialGrants: [{ to: 'u:alice', asset: 'TUMBO', amountFluff: 5000000 }] });
  const s = v.stake({ from: 'u:alice', asset: 'TUMBO', amountFluff: 1000000, idempotencyKey: 'w1' });
  v.advanceTick({ ticks: 200, idempotencyKey: 'w2' });
  const done = v.unstake({ positionId: s.position.id, idempotencyKey: 'w3' });
  const bal = v.balance('u:alice', 'TUMBO');
  const totals = v.conservationTotals();
  log('rewardPaid=' + done.extra.rewardPaidFluff + ' (expect 100000)');
  log('alice=' + bal + ' (expect 5100000)');
  log('vault=' + v.vaultBalance('TUMBO') + ' (expect 0)');
  log('conservation TUMBO=' + totals.TUMBO + ' (expect 1000000000)');
  log('integrity=' + v.assertVaultIntegrity() + ' conservation=' + v.assertConservation());
  const ok = bal === 5100000 && totals.TUMBO === 1000000000 && done.extra.rewardPaidFluff === 100000;
  log(ok ? 'FIX VERIFIED' : 'STILL BROKEN');
} catch (e) {
  log('ERROR: ' + ((e && e.stack) || String(e)));
}
</script>
</body>
</html>
