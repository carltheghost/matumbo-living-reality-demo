<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vault diag</title>
<style>body{font-family:ui-monospace,monospace;background:#0a1428;color:#dff1ff;padding:24px;white-space:pre-wrap}</style>
</head>
<body><div id="out">running…</div>
<script type="module">
const lines = [];
const log = (s) => { lines.push(String(s)); document.getElementById('out').textContent = lines.join('\n'); document.title = 'DIAG ' + String(s).slice(0, 80); };
try {
  const T = await import('https://cdn.jsdelivr.net/gh/carltheghost/matumbo-living-reality-demo@gpt/token-vault/src/domains/token.js?diag=1');
  const v = T.createTokenVaultLedger({ initialGrants: [{ to: 'u:alice', asset: 'TUMBO', amountFluff: 5000000 }] });
  log('alice0=' + v.balance('u:alice', 'TUMBO'));
  const s = v.stake({ from: 'u:alice', asset: 'TUMBO', amountFluff: 1000000, idempotencyKey: 'd1' });
  log('after stake: alice=' + v.balance('u:alice', 'TUMBO') + ' vault=' + v.vaultBalance('TUMBO'));
  log('position=' + JSON.stringify(s.position));
  v.advanceTick({ ticks: 200, idempotencyKey: 'd2' });
  log('tick=' + v.tick() + ' estimateRewards=' + v.estimateRewards(s.position.id));
  const done = v.unstake({ positionId: s.position.id, idempotencyKey: 'd3' });
  log('unstake extra=' + JSON.stringify(done.extra));
  log('alice2=' + v.balance('u:alice', 'TUMBO') + ' vault=' + v.vaultBalance('TUMBO'));
  const js = v.journals();
  log('last journal legs=' + JSON.stringify(js[js.length - 1].legs));
  log('treasury=' + v.balance('sys:treasury', 'TUMBO') + ' reserve=' + v.rewardsReserveOf('TUMBO'));
  log('conservation=' + JSON.stringify(v.conservationTotals()));
  log('DONE');
} catch (e) {
  log('ERROR: ' + ((e && e.stack) || String(e)));
}
</script>
</body>
</html>
