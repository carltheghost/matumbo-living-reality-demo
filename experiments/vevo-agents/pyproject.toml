[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vevo-agents"
version = "0.1.0"
description = "CPU-scale five-brain local proof with SIMFABRIC state"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
