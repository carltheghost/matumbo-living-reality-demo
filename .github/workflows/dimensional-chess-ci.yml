name: Dimensional Chess CI
on:
  pull_request:
    paths:
      - "src/domains/chess-4d.js"
      - "src/render/dimensional-chess.js"
      - "src/main.js"
      - "tests/chess-4d.test.mjs"
  push:
    branches: ["gpt/dimensional-chess-rebuild-2026-09-22"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/domains/chess-4d.js
      - run: node --check src/render/dimensional-chess.js
      - run: node --check src/main.js
      - run: node --test tests/chess-4d.test.mjs
