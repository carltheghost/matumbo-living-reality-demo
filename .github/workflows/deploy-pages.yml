name: Deploy maTumbo Living Reality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -R index.html favicon.svg dist/
          cp -R src dist/
          cp -R vendor dist/
          find . -maxdepth 1 -type f \( -name '*.css' -o -name '*.html' \) -not -path './index.html' -exec cp {} dist/ \;
          printf '%s\n' "maTumbo Living Reality deployment" > dist/health.txt

          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<script type="module" src="./src/render/reality-25-bridge.js?v=20260922-directional2"></script>'
          if marker not in html:
              html = html.replace('</body>', f'{marker}</body>')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
