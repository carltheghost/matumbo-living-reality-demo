name: Deploy maTumbo Living Reality

on:
  push:
    branches: [main, fix/field-lab-grab-worker-2026-10-10]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a stale repair branch
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical simulated-economy bytes are staged for the phone route
        run: python3 scripts/vivo/stage_economy_dependencies.py --check
      - name: Build static site without replacing the canonical root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -R index.html favicon.svg vivo-phone-sw.js dist/
          cp -R src dist/
          cp -R vendor dist/
          mkdir -p dist/services/vivo/web
          cp -R services/vivo/web/. dist/services/vivo/web/
          find . -maxdepth 1 -type f \( -name '*.css' -o -name '*.html' \) -not -path './index.html' -exec cp {} dist/ \;
          printf '%s\n' "maTumbo Living Reality deployment" > dist/health.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<script type="module">import("./src/render/reality-25-bridge.js?v=20260922-directional3").catch((error)=>{try{console.warn("[reality25] optional surface degraded:",error);}catch{}});</script>'
          if marker not in html:
              html = html.replace('</body>', f'{marker}</body>')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Verify the static Vivo phone route and local-only boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
              Path('dist/services/vivo/web/phone/index.html'),
              Path('dist/services/vivo/web/phone/bootstrap.mjs'),
              Path('dist/services/vivo/web/phone/economy-entry.mjs'),
              Path('dist/services/vivo/web/phone/static-shared.js'),
              Path('dist/services/vivo/web/phone/field-world.mjs'),
              Path('dist/services/vivo/web/phone/spatial-fabric.mjs'),
              Path('dist/services/vivo/web/phone/phone-render.mjs'),
              Path('dist/services/vivo/web/phone/phone-world.css'),
              Path('dist/services/vivo/web/phone/field-palette.mjs'),
              Path('dist/services/vivo/web/phone/vendor/economy/manifest.json'),
              Path('dist/services/vivo/web/phone/vendor/economy/src/domains/simulated-economy.js'),
              Path('dist/services/vivo/web/phone/vendor/economy/src/domains/token.js'),
              Path('dist/services/vivo/web/phone/vendor/economy/src/domains/token-config.js'),
              Path('dist/services/vivo/web/phone/vendor/economy/src/domains/token-store.js'),
              Path('dist/services/vivo/web/phone/vendor/economy/src/render/simulated-economy-panel.js'),
              Path('dist/services/vivo/web/vivo-sw.js'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing static Vivo phone assets: ' + ', '.join(missing))
          route = required[0].read_text(encoding='utf-8')
          if './static-shared.js' not in route or './bootstrap.mjs' not in route or '../shared.css' not in route:
              raise SystemExit('Static Vivo phone route does not use its self-contained relative assets')
          bootstrap = required[1].read_text(encoding='utf-8')
          static_shared = required[3].read_text(encoding='utf-8')
          if 'PAGES STATIC/OFFLINE' not in static_shared or "api('/readyz'" in static_shared:
              raise SystemExit('Static phone launcher still contains a backend readiness call')
          if 'PAGES STATIC/OFFLINE' not in bootstrap or 'canonical authority unavailable' not in bootstrap:
              raise SystemExit('Static route authority boundary is not explicit in the phone bootstrap')
          if './economy-entry.mjs' not in bootstrap or 'TUMBO-SIM' not in route:
              raise SystemExit('Static phone launcher did not retain the mounted simulated economy entry')
          sw = required[-1].read_text(encoding='utf-8')
          for asset in ('phone/index.html', 'phone/static-shared.js', 'phone/field-world.mjs', 'phone/spatial-fabric.mjs', 'phone/economy-entry.mjs', 'phone/phone-render.mjs', 'phone/phone-world.css', 'phone/field-palette.mjs', 'phone/vendor/economy/manifest.json', 'phone/vendor/economy/src/domains/simulated-economy.js', 'phone/vendor/economy/src/domains/token.js', 'phone/vendor/economy/src/domains/token-config.js', 'phone/vendor/economy/src/domains/token-store.js', 'phone/vendor/economy/src/render/simulated-economy-panel.js'):
              if asset not in sw:
                  raise SystemExit('Phone asset is absent from the offline shell: ' + asset)
          print('Verified static Vivo phone route with local-only authority controls')
          PY
      - name: Download pinned hand assets into the static deployment
        run: python3 scripts/field-lab/prepare.py
      - name: Install isolated browser test dependency
        run: |
          mkdir -p /tmp/field-worker-test
          cd /tmp/field-worker-test
          npm init -y >/dev/null
          npm install --save-exact playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real neural worker inference before deployment
        env:
          NODE_PATH: /tmp/field-worker-test/node_modules
        run: |
          python3 -m http.server 9876 --bind 127.0.0.1 --directory dist >/tmp/field-http.log 2>&1 &
          node scripts/field-lab/test-worker.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: field-worker-real-check
          path: field-worker-real-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: field-hand-vendored-assets
          path: dist/vendor/field-lab
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the new HTTPS launcher and repair source
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.request
          base = 'https://carltheghost.github.io/matumbo-living-reality-demo/'
          report = []
          for name in ['field-lab-grab.html', 'src/field-lab/field-lab-touch-repair.js', 'field-lab-studio.html', 'src/field-lab/studio-core.js', 'src/field-lab/studio.js', 'src/field-lab/studio-layout.js', 'src/field-lab/viva-core.js', 'src/field-lab/viva-visibility.js', 'src/field-lab/viva-spaces.js', 'vivo-phone-sw.js', 'src/vivo-phone-engine/boot.mjs', 'src/vivo-phone-engine/engine.mjs', 'src/vivo-phone-engine/engine-worker.mjs', 'src/vivo-phone-engine/agent-runtime.mjs', 'src/vivo-phone-engine/native-tools.mjs', 'src/vivo-phone-engine/storage.mjs', 'services/vivo/web/phone/index.html', 'services/vivo/web/phone/bootstrap.mjs', 'services/vivo/web/phone/agent-control.mjs', 'services/vivo/web/phone/agent-tools.mjs', 'services/vivo/web/phone/bridge.mjs', 'services/vivo/web/phone/client.mjs', 'services/vivo/web/phone/engine.mjs', 'services/vivo/web/phone/engine-worker.mjs', 'services/vivo/web/phone/two-hand-camera.mjs', 'services/vivo/web/phone/economy-entry.mjs', 'services/vivo/web/phone/static-shared.js', 'services/vivo/web/phone/field-world.mjs', 'services/vivo/web/phone/spatial-fabric.mjs', 'services/vivo/web/phone/phone-render.mjs', 'services/vivo/web/phone/phone-world.css', 'services/vivo/web/phone/field-palette.mjs', 'services/vivo/web/phone/vendor/economy/manifest.json', 'services/vivo/web/phone/vendor/economy/src/domains/simulated-economy.js', 'services/vivo/web/phone/vendor/economy/src/domains/token.js', 'services/vivo/web/phone/vendor/economy/src/domains/token-config.js', 'services/vivo/web/phone/vendor/economy/src/domains/token-store.js', 'services/vivo/web/phone/vendor/economy/src/render/simulated-economy-panel.js', 'services/vivo/web/vivo-sw.js']:
              expected = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              for attempt in range(18):
                  try:
                      with urllib.request.urlopen(base + name + '?verify=' + expected[:16], timeout=15) as r:
                          actual = r.read()
                          assert r.status == 200
                      assert hashlib.sha256(actual).hexdigest() == expected
                      report.append({'path': name, 'status': 200, 'sha256': expected, 'live_matches_source': True})
                      break
                  except Exception:
                      if attempt == 17: raise
                      time.sleep(5)
          pathlib.Path('field-grab-live-check.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: field-grab-live-check
          path: field-grab-live-check.json
