name: Deploy maTumbo Living Reality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -R index.html favicon.svg dist/
          cp -R src dist/
          cp -R vendor dist/
          find . -maxdepth 1 -type f \( -name '*.css' -o -name '*.html' \) -not -path './index.html' -exec cp {} dist/ \;
          printf '%s\n' "maTumbo Living Reality deployment" > dist/health.txt
          printf '%s\n' "$GITHUB_SHA" > dist/build.txt

          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<script type="module">import("./src/render/reality-25-bridge.js?v=20260922-directional3").catch((error)=>{try{console.warn("[reality25] optional surface degraded:",error);}catch{}});</script>'
          if marker not in html:
              html = html.replace('</body>', f'{marker}</body>')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser proof runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove exact deployed Reality Lens build
        env:
          MATUMBO_NODE_DEPENDENCIES: ${{ github.workspace }}/package.json
          MATUMBO_PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
          MATUMBO_EXPECTED_BUILD: ${{ github.sha }}
        run: node tests/browser-universal-reality-live.mjs

      - name: Prove real contract data on exact deployed build
        env:
          MATUMBO_NODE_DEPENDENCIES: ${{ github.workspace }}/package.json
          MATUMBO_PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/browser-contract-workflow.mjs

      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-universal-reality-proof-${{ github.sha }}
          path: |
            artifacts/universal-browser
            artifacts/contract-browser
          if-no-files-found: warn
          retention-days: 30
