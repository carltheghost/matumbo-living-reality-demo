name: Vivo mounted local application
on:
  pull_request:
    paths:
      - 'services/vivo/**'
      - 'services/vivo_material/**'
      - 'research/vivo-phase-fabric/viva_phase/**'
      - 'research/vivo-phase-fabric/web/target-mailbox.mjs'
      - 'scripts/vivo/**'
      - '.github/workflows/vivo-application.yml'
permissions:
  contents: read
jobs:
  actual-entrypoint:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24.19.0']
    name: Mounted application (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: python -m pip install -r services/vivo/requirements.txt
      - run: python scripts/vivo/stage_input_dependency.py
      - name: Exact imported originals remain unchanged
        run: python scripts/vivo/verify_source_import.py
      - name: Application adapters, private authority runtime and real HTTP launcher
        run: |
          set -euo pipefail
          mkdir -p application-evidence
          # Node 22 retains every POSIX scenario. SQLite is an explicit Node 24.19 backend.
          if [[ '${{ matrix.node }}' == '22' ]]; then
            mapfile -t app_tests < <(find services/vivo/tests/application -maxdepth 1 -name '*.test.mjs' ! -name 'sqlite-runtime.test.mjs' | sort)
            node --test "${app_tests[@]}" services/vivo/tests/material-authority/*.test.mjs services/vivo_material/tests/*.test.mjs | tee application-evidence/node.log
            mapfile -t py_tests < <(find services/vivo/tests/application -maxdepth 1 -name 'test_*.py' ! -name 'test_sqlite_entrypoint.py' -printf '%f\n' | sed 's/\.py$//' | sort)
            PYTHONPATH="$PWD/services/vivo/tests/application:$PWD${PYTHONPATH:+:$PYTHONPATH}" python -m unittest "${py_tests[@]}" -v 2>&1 | tee application-evidence/http.log
          else
            node --test services/vivo/tests/application/*.test.mjs services/vivo/tests/material-authority/*.test.mjs services/vivo_material/tests/*.test.mjs | tee application-evidence/node.log
            python -m unittest discover -s services/vivo/tests/application -p 'test_*.py' -v 2>&1 | tee application-evidence/http.log
          fi
          python -m unittest discover -s services/vivo_material/tests -v 2>&1 | tee application-evidence/material.log
          python -m services.vivo_material.verify > application-evidence/numerical.json
      - name: Original runtime regression and integration contracts
        run: |
          set -euo pipefail
          python scripts/vivo/test_import_stage_a.py 2>&1 | tee application-evidence/import.log
          if [[ '${{ matrix.node }}' == '22' ]]; then
            mapfile -t authority_tests < <(find services/vivo/tests/authority -maxdepth 1 -name '*.test.mjs' ! -name 'sqlite-store.test.mjs' | sort)
          else
            mapfile -t authority_tests < <(find services/vivo/tests/authority -maxdepth 1 -name '*.test.mjs' | sort)
          fi
          node --test "${authority_tests[@]}" services/vivo/tests/input/*.test.mjs services/vivo/tests/integration/contracts.test.mjs research/vivo-phase-fabric/tests/target-mailbox.test.mjs | tee application-evidence/composition.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-mounted-application-evidence-node-${{ matrix.node }}
          path: application-evidence/
          retention-days: 7
  browser-studio-authority-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned runtime and browser-test requirements
        run: python -m pip install -r services/vivo/requirements-dev.txt
      - name: Install the pinned Playwright Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Stage the exact input dependency
        run: python scripts/vivo/stage_input_dependency.py
      - name: Run the mounted journal-capacity and write-race regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          data_dir="$(mktemp -d)"
          server_pid=''
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$data_dir"
          }
          trap cleanup EXIT
          VIVO_PYTHON=python services/vivo/start-canonical-local.sh --store posix --journal-events 18 --data-dir "$data_dir" --port 8769 >browser-evidence/server-capacity.log 2>&1 &
          server_pid=$!
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          url = 'http://127.0.0.1:8769/api/local/ready'
          deadline = time.monotonic() + 45
          last = None
          while time.monotonic() < deadline:
              try:
                  with urlopen(url, timeout=2) as response:
                      body = json.load(response)
                  if response.status == 200 and body.get('ok') is True:
                      print('local capacity application ready')
                      break
                  last = body
              except Exception as error:
                  last = f'{type(error).__name__}: {error}'
              time.sleep(0.25)
          else:
              raise SystemExit(f'local capacity readiness timeout: {last!r}')
          PY
          timeout --signal=TERM 90s python services/vivo/tests/application/browser_studio_authority_capacity.py \
            http://127.0.0.1:8769/local/ browser-evidence/browser-studio-authority-capacity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-mounted-browser-studio-authority-capacity-evidence
          path: browser-evidence/
          retention-days: 7
      - name: Scope notice
        run: echo 'This is synthetic Chromium loopback evidence for journal-capacity write gating and race settlement; it does not certify physical camera, hand, head, AR, VR, public networking or deployment behavior.'
  browser-x4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned runtime and browser-test requirements
        run: python -m pip install -r services/vivo/requirements-dev.txt
      - name: Install the pinned Playwright Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Stage the exact input dependency
        run: python scripts/vivo/stage_input_dependency.py
      - name: Run the explicit camera-off x4 browser regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          data_dir="$(mktemp -d)"
          server_pid=''
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$data_dir"
          }
          trap cleanup EXIT
          VIVO_PYTHON=python services/vivo/start-canonical-local.sh --port 8767 --material-phase --data-dir "$data_dir" >browser-evidence/server.log 2>&1 &
          server_pid=$!
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          url = 'http://127.0.0.1:8767/api/local/ready'
          deadline = time.monotonic() + 45
          last = None
          while time.monotonic() < deadline:
              try:
                  with urlopen(url, timeout=2) as response:
                      body = json.load(response)
                  if response.status == 200 and body.get('ok') is True:
                      print('local application ready')
                      break
                  last = body
              except Exception as error:
                  last = f'{type(error).__name__}: {error}'
              time.sleep(0.25)
          else:
              raise SystemExit(f'local application readiness timeout: {last!r}')
          PY
          timeout --signal=TERM 60s python services/vivo/tests/application/browser_studio_authority_material.py \
            http://127.0.0.1:8767/local/ browser-evidence/browser-studio-authority-material.json
          timeout --signal=TERM 90s python services/vivo/tests/application/browser_x4_regression.py \
            http://127.0.0.1:8767/local/accepted/ browser-evidence/browser-x4-regression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-mounted-browser-x4-evidence
          path: browser-evidence/
          retention-days: 7
      - name: Scope notice
        run: echo 'This is a separate headless Chromium loopback regression for camera-off x4 targets and lease cleanup; existing Python discovery jobs do not cover browser behavior, cameras, physical devices, public networking or deployment.'
  browser-studio-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned runtime and browser-test requirements
        run: python -m pip install -r services/vivo/requirements-dev.txt
      - name: Install the pinned Playwright Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Stage the exact input dependency
        run: python scripts/vivo/stage_input_dependency.py
      - name: Run the explicit two-tab Full Studio authority bridge smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          data_dir="$(mktemp -d)"
          server_pid=''
          stop_server() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            server_pid=''
          }
          cleanup() {
            stop_server
            rm -rf "$data_dir"
          }
          trap cleanup EXIT
          VIVO_PYTHON=python services/vivo/start-canonical-local.sh --store posix --data-dir "$data_dir" --port 8768 >browser-evidence/server-studio.log 2>&1 &
          server_pid=$!
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          url = 'http://127.0.0.1:8768/api/local/ready'
          deadline = time.monotonic() + 45
          last = None
          while time.monotonic() < deadline:
              try:
                  with urlopen(url, timeout=2) as response:
                      body = json.load(response)
                  if response.status == 200 and body.get('ok') is True:
                      print('local application ready')
                      break
                  last = body
              except Exception as error:
                  last = f'{type(error).__name__}: {error}'
              time.sleep(0.25)
          else:
              raise SystemExit(f'local application readiness timeout: {last!r}')
          PY
          timeout --signal=TERM 90s python services/vivo/tests/application/browser_studio_authority.py \
            http://127.0.0.1:8768/local/ browser-evidence/browser-studio-authority.json
          stop_server
          VIVO_PYTHON=python services/vivo/start-canonical-local.sh --store posix --data-dir "$data_dir" --port 8768 >>browser-evidence/server-studio.log 2>&1 &
          server_pid=$!
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          url = 'http://127.0.0.1:8768/api/local/ready'
          deadline = time.monotonic() + 45
          last = None
          while time.monotonic() < deadline:
              try:
                  with urlopen(url, timeout=2) as response:
                      body = json.load(response)
                  if response.status == 200 and body.get('ok') is True:
                      print('local application ready')
                      break
                  last = body
              except Exception as error:
                  last = f'{type(error).__name__}: {error}'
              time.sleep(0.25)
          else:
              raise SystemExit(f'local application readiness timeout: {last!r}')
          PY
          timeout --signal=TERM 60s python services/vivo/tests/application/browser_studio_authority_restart.py \
            http://127.0.0.1:8768/local/ 2.5 1 2.8 5 browser-evidence/browser-studio-authority-restart.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-mounted-browser-studio-authority-evidence
          path: browser-evidence/
          retention-days: 7
      - name: Scope notice
        run: echo 'This is synthetic two-tab loopback browser evidence for separate Studio projection and canonical commit, including POSIX restart persistence; it does not certify physical camera, hand, head, AR, VR, public networking or deployment behavior.'
