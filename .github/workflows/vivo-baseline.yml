name: Vivo baseline contracts and references
on:
  pull_request:
    paths:
      - 'coordination/vivo/**'
      - 'services/vivo/**'
      - 'research/vivo-phase-fabric/**'
      - 'scripts/vivo/**'
      - '.github/workflows/vivo-baseline.yml'
  push:
    branches: ['vivo/**']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r research/vivo-phase-fabric/requirements.txt
      - name: Contracts and source-intake tests only
        run: |
          node --test services/vivo/tests/integration/contracts.test.mjs
          python -m unittest discover -s services/vivo/tests/integration -p 'test_*.py' -v
      - name: Recovered native solver and target scheduler
        run: |
          PYTHONPATH=research/vivo-phase-fabric python -m unittest discover -s research/vivo-phase-fabric/tests -p 'test_*.py' -v
          node --test research/vivo-phase-fabric/tests/target-mailbox.test.mjs
      - name: Scope notice
        run: echo 'This job tests contracts and recovered references, not the complete 0.8.1 overlay, browser, real phone, camera or public collaboration.'
