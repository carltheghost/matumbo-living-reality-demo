name: Vivo phone stage

on:
  pull_request:
    paths:
      - 'services/vivo/web/**'
      - 'services/vivo/android-companion/**'
      - 'src/domains/simulated-economy.js'
      - 'src/domains/snapshot-graph.js'
      - 'src/domains/token*.js'
      - 'src/render/simulated-economy-panel.js'
      - 'src/render/token-economy-overview.js'
      - 'scripts/vivo/stage_economy_dependencies.py'
      - 'scripts/vivo/verify_economy_asset_coverage.py'
      - 'services/vivo/web/phone/tests/browser_economy_mounted.py'
      - 'services/vivo/web/phone/tests/browser_dimensional_contact.py'
      - 'services/vivo/web/phone/tests/browser_service_worker_upgrade.py'
      - 'docs/vivo-phone-*.md'
      - '.github/workflows/vivo-phone.yml'
  push:
    branches:
      - 'viva/android-phone-engine-2026-10-11'
    paths:
      - 'services/vivo/web/**'
      - 'services/vivo/android-companion/**'
      - 'src/domains/simulated-economy.js'
      - 'src/domains/snapshot-graph.js'
      - 'src/domains/token*.js'
      - 'src/render/simulated-economy-panel.js'
      - 'src/render/token-economy-overview.js'
      - 'scripts/vivo/stage_economy_dependencies.py'
      - 'scripts/vivo/verify_economy_asset_coverage.py'
      - 'services/vivo/web/phone/tests/browser_economy_mounted.py'
      - 'services/vivo/web/phone/tests/browser_dimensional_contact.py'
      - 'services/vivo/web/phone/tests/browser_service_worker_upgrade.py'
      - 'docs/vivo-phone-*.md'
      - '.github/workflows/vivo-phone.yml'

permissions:
  contents: read

jobs:
  web-phone-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify staged economy asset coverage
        run: python3 scripts/vivo/verify_economy_asset_coverage.py
      - run: node --test services/vivo/web/phone/tests/*.test.mjs
      - name: Check browser module syntax
        run: |
          find services/vivo/web/phone -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --check services/vivo/web/application/conversation-transport.mjs
          node --check services/vivo/web/application/remote-transport.mjs
          node --input-type=module --check < services/vivo/web/camera.js
          node --input-type=module --check < services/vivo/web/hand-worker.js
          node --input-type=module --check < services/vivo/web/render.js

  browser-mounted-economy:
    name: Mounted simulated economy phone flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Chromium browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify canonical economy dependency staging
        run: python scripts/vivo/stage_economy_dependencies.py --check
      - name: Run direct mounted economy flows against the phone source route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          python -m http.server 9897 --bind 127.0.0.1 --directory . >browser-evidence/server-economy.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python services/vivo/web/phone/tests/browser_economy_mounted.py http://127.0.0.1:9897/ | tee browser-evidence/economy-mounted.json
          python services/vivo/web/phone/tests/browser_conversation_transport.py http://127.0.0.1:9897/ | tee browser-evidence/conversation-transport-source.json
          python services/vivo/web/phone/tests/browser_agent_stop.py http://127.0.0.1:9897/ | tee browser-evidence/agent-stop-source.json
          python services/vivo/web/phone/tests/browser_dimensional_contact.py http://127.0.0.1:9897/ | tee browser-evidence/dimensional-contact-source.json
          python services/vivo/web/phone/tests/browser_material_deformation.py http://127.0.0.1:9897/ | tee browser-evidence/material-deformation-source.json
          python services/vivo/web/phone/tests/browser_phone_route_repair.py http://127.0.0.1:9897/ | tee browser-evidence/phone-route-repair-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-phone-mounted-economy-evidence
          path: browser-evidence/
          retention-days: 7
      - name: Scope notice
        run: echo 'Mounted economy evidence is local simulated TUMBO-SIM state in Chromium; it does not certify remote authority, real funds, external orders, real-money settlement, camera behavior, or deployment by itself.'

  browser-offline-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade regression extracts pinned v13, v14, and exact-base
          # v16 web trees instead of relabelling current assets.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependency
        run: python -m pip install playwright==1.57.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Reopen the canonical Companion URL offline
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 9878 --bind 127.0.0.1 --directory . >"$RUNNER_TEMP/vivo-phone-offline-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen
          deadline = time.monotonic() + 20
          while time.monotonic() < deadline:
              try:
                  with urlopen('http://127.0.0.1:9878/services/vivo/web/', timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  pass
              time.sleep(0.1)
          else:
              raise SystemExit('static server timeout')
          PY
          python services/vivo/web/phone/tests/browser_offline_shell.py http://127.0.0.1:9878/

      - name: Run v13 to v14 to v16 to v17 to v18 service-worker upgrade browser regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          python services/vivo/web/phone/tests/browser_service_worker_upgrade.py \
            | tee browser-evidence/service-worker-upgrade.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-phone-service-worker-upgrade-evidence
          path: browser-evidence/
          retention-days: 7

  browser-field-world-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependency
        run: python -m pip install playwright==1.57.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build the exact static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf browser-static
          mkdir -p browser-static/services/vivo/web
          cp -R services/vivo/web/. browser-static/services/vivo/web/
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('browser-static/services/vivo/web/phone/index.html'),
              Path('browser-static/services/vivo/web/phone/bootstrap.mjs'),
              Path('browser-static/services/vivo/web/phone/static-shared.js'),
              Path('browser-static/services/vivo/web/phone/field-world.mjs'),
              Path('browser-static/services/vivo/web/phone/spatial-fabric.mjs'),
              Path('browser-static/services/vivo/web/phone/economy-entry.mjs'),
              Path('browser-static/services/vivo/web/phone/phone-render.mjs'),
              Path('browser-static/services/vivo/web/phone/phone-world.css'),
              Path('browser-static/services/vivo/web/phone/field-palette.mjs'),
              Path('browser-static/services/vivo/web/phone/material-contract.mjs'),
              Path('browser-static/services/vivo/web/phone/material-patch.mjs'),
              Path('browser-static/services/vivo/web/phone/material-input-runtime.mjs'),
              Path('browser-static/services/vivo/web/phone/fingertip-input.mjs'),
              Path('browser-static/services/vivo/web/phone/vendor/economy/manifest.json'),
              Path('browser-static/services/vivo/web/phone/vendor/economy/src/domains/simulated-economy.js'),
              Path('browser-static/services/vivo/web/phone/vendor/economy/src/domains/snapshot-graph.js'),
              Path('browser-static/services/vivo/web/phone/vendor/economy/src/domains/token.js'),
              Path('browser-static/services/vivo/web/phone/vendor/economy/src/domains/token-config.js'),
              Path('browser-static/services/vivo/web/phone/vendor/economy/src/domains/token-supply-policy.js'),
              Path('browser-static/services/vivo/web/phone/vendor/economy/src/domains/token-economy-overview.js'),
              Path('browser-static/services/vivo/web/phone/vendor/economy/src/domains/token-store.js'),
              Path('browser-static/services/vivo/web/phone/vendor/economy/src/render/simulated-economy-panel.js'),
              Path('browser-static/services/vivo/web/phone/vendor/economy/src/render/token-economy-overview.js'),
              Path('browser-static/services/vivo/web/vivo-sw.js'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('missing built phone assets: ' + ', '.join(missing))
          route = required[0].read_text(encoding='utf-8')
          bootstrap = required[1].read_text(encoding='utf-8')
          static_shared = required[2].read_text(encoding='utf-8')
          if './static-shared.js' not in route or './bootstrap.mjs' not in route:
              raise SystemExit('static phone route did not preserve its local bootstrap')
          if 'PAGES STATIC/OFFLINE' not in static_shared or "api('/readyz'" in static_shared:
              raise SystemExit('static phone launcher still contains a backend readiness call')
          if 'PAGES STATIC/OFFLINE' not in bootstrap or 'canonical authority unavailable' not in bootstrap:
              raise SystemExit('static authority boundary is missing')
          if './economy-entry.mjs' not in bootstrap or 'TUMBO-SIM' not in route:
              raise SystemExit('mounted simulated economy entry is missing')
          sw = required[-1].read_text(encoding='utf-8')
          for asset in ('phone/economy-entry.mjs', 'phone/phone-render.mjs', 'phone/phone-world.css', 'phone/field-palette.mjs', 'phone/material-contract.mjs', 'phone/material-patch.mjs', 'phone/material-input-runtime.mjs', 'phone/fingertip-input.mjs', 'phone/vendor/economy/manifest.json', 'phone/vendor/economy/src/domains/simulated-economy.js', 'phone/vendor/economy/src/domains/snapshot-graph.js', 'phone/vendor/economy/src/domains/token.js', 'phone/vendor/economy/src/domains/token-config.js', 'phone/vendor/economy/src/domains/token-supply-policy.js', 'phone/vendor/economy/src/domains/token-economy-overview.js', 'phone/vendor/economy/src/domains/token-store.js', 'phone/vendor/economy/src/render/simulated-economy-panel.js', 'phone/vendor/economy/src/render/token-economy-overview.js'):
              if asset not in sw:
                  raise SystemExit('economy phone asset is absent from the offline shell: ' + asset)
          print('built static phone artifact verified')
          PY
      - name: Run field-world and offline static browser smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          python -m http.server 9896 --bind 127.0.0.1 --directory browser-static >browser-evidence/server-field-world-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen
          deadline = time.monotonic() + 20
          while time.monotonic() < deadline:
              try:
                  with urlopen('http://127.0.0.1:9896/services/vivo/web/phone/', timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  pass
              time.sleep(0.1)
          else:
              raise SystemExit('static artifact server timeout')
          PY
          python services/vivo/web/phone/tests/browser_field_world_static.py http://127.0.0.1:9896/ | tee browser-evidence/field-world-static.json
          python services/vivo/web/phone/tests/browser_conversation_transport.py http://127.0.0.1:9896/ | tee browser-evidence/conversation-transport-pages.json
          python services/vivo/web/phone/tests/browser_economy_mounted.py http://127.0.0.1:9896/ | tee browser-evidence/economy-mounted-built.json
          python services/vivo/web/phone/tests/browser_bimanual_transform.py http://127.0.0.1:9896/ | tee browser-evidence/bimanual-transform.json
          python services/vivo/web/phone/tests/browser_phone_route_repair.py http://127.0.0.1:9896/ | tee browser-evidence/phone-route-repair-pages.json
          python services/vivo/web/phone/tests/browser_agent_stop.py http://127.0.0.1:9896/ | tee browser-evidence/agent-stop-pages.json
          python services/vivo/web/phone/tests/browser_dimensional_contact.py http://127.0.0.1:9896/ | tee browser-evidence/dimensional-contact-pages.json
          python services/vivo/web/phone/tests/browser_material_deformation.py http://127.0.0.1:9896/ | tee browser-evidence/material-deformation-pages.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-phone-browser-field-world-static-evidence
          path: browser-evidence/
          retention-days: 7
      - name: Scope notice
        run: echo 'This is synthetic Chromium evidence against the built Pages artifact; it does not certify physical camera, hand, head, Android device, AR, VR, remote authority, or deployment behavior.'

  browser-authority-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mounted local-app and browser-test requirements
        run: python -m pip install -r services/vivo/requirements-dev.txt
      - name: Install the pinned Playwright Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Stage the exact input dependency
        run: python scripts/vivo/stage_input_dependency.py
      - name: Run the explicit phone authority adapter browser smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          server_pid=''
          stop_server() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            server_pid=''
          }
          trap stop_server EXIT
          VIVO_PYTHON=python services/vivo/start-canonical-local.sh --store memory --port 9895 >browser-evidence/server-authority-adapter.log 2>&1 &
          server_pid=$!
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          url = 'http://127.0.0.1:9895/api/local/ready'
          deadline = time.monotonic() + 45
          last = None
          while time.monotonic() < deadline:
              try:
                  with urlopen(url, timeout=2) as response:
                      body = json.load(response)
                  if response.status == 200 and body.get('ok') is True:
                      print('local application ready')
                      break
                  last = body
              except Exception as error:
                  last = f'{type(error).__name__}: {error}'
              time.sleep(0.25)
          else:
              raise SystemExit(f'local application readiness timeout: {last!r}')
          PY
          timeout --signal=TERM 90s python services/vivo/web/phone/tests/browser_authority_adapter.py \
            http://127.0.0.1:9895 browser-evidence/browser-authority-adapter.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-phone-browser-authority-adapter-evidence
          path: browser-evidence/
          retention-days: 7
      - name: Scope notice
        run: echo 'This is synthetic two-page Chromium loopback evidence for explicit phone authority preview, projection, canonical commit and offline no-send; it does not certify physical camera, hand, head, AR, VR, Android device or deployment behavior.'

  android-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Platform 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager was not found under $SDK_ROOT" >&2; exit 1; fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Install Gradle 8.11.1
        run: |
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.11.1-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Test broker policy and build debug APK
        working-directory: services/vivo/android-companion
        run: gradle --no-daemon testDebugUnitTest assembleDebug

