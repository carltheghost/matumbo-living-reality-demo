name: Vivo Android resilience
on:
  pull_request:
    paths:
      - 'services/vivo/android-companion/**'
      - 'scripts/vivo/android_*'
      - '.github/workflows/vivo-android-resilience.yml'
permissions:
  contents: read
concurrency:
  group: vivo-android-resilience-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preserve public source used for this build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-evidence
          git rev-parse HEAD > android-evidence/source-commit.txt
          git archive --format=zip HEAD services/vivo/android-companion services/vivo/web scripts/vivo AGENTS.md coordination/vivo > android-evidence/source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vivo-android-source
          path: android-evidence/source*
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bundle safety checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/vivo -p 'android_bundle_test.py' -v 2>&1 | tee android-evidence/bundle-tests.log
      - name: Build and test the existing Android companion
        shell: bash
        working-directory: services/vivo/android-companion
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest | tee ../../../android-evidence/gradle.log
      - name: Record APK checksum and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=services/vivo/android-companion/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" android-evidence/maTumbo-Vivo-30-preview.apk
          sha256sum "$APK" > android-evidence/apk-sha256.txt
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > android-evidence/apk-certificate.txt
          cp services/vivo/android-companion/app/build/generated/vivo/assets/vivo/android-bundle.json android-evidence/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android offline runtime and retained-state checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/vivo/android_emulator_checks.sh
      - name: Preserve emulator diagnostics
        if: always()
        shell: bash
        run: |
          find services/vivo/android-companion/app/build -name '*.xml' -path '*results*' -print > android-evidence/result-files.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-android-build-evidence
          path: |
            android-evidence/
            services/vivo/android-companion/app/build/test-results/
            services/vivo/android-companion/app/build/outputs/androidTest-results/
            services/vivo/android-companion/app/build/reports/androidTests/
          retention-days: 7
