name: Vivo Android companion
on:
  pull_request:
    paths:
      - 'android/vivo-companion/**'
      - 'src/vivo-phone-engine/**'
      - 'vivo-phone-sw.js'
      - 'field-lab-studio.html'
      - '.github/workflows/vivo-android-companion.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phone-engine syntax
        run: |
          set -euo pipefail
          node --check src/vivo-phone-engine/native-tools.mjs
          node --check src/vivo-phone-engine/agent-runtime.mjs
          node --check src/vivo-phone-engine/storage.mjs
          node --check src/vivo-phone-engine/engine-worker.mjs
          node --check src/vivo-phone-engine/engine.mjs
          node --check src/vivo-phone-engine/boot.mjs
          node --check vivo-phone-sw.js
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p android/vivo-companion :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vivo-android-companion-debug
          path: android/vivo-companion/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Scope
        run: echo 'Debug companion build only; no install, store publication, root escalation or deployment.'

  browser-phone-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependency
        run: python -m pip install playwright==1.57.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run GitHub-page phone-engine smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phone-engine-evidence
          python -m http.server 9877 --bind 127.0.0.1 --directory . >phone-engine-evidence/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen
          deadline=time.monotonic()+20
          while time.monotonic()<deadline:
              try:
                  with urlopen('http://127.0.0.1:9877/field-lab-studio.html',timeout=2) as r:
                      if r.status==200: break
              except Exception: pass
              time.sleep(.1)
          else: raise SystemExit('static server timeout')
          PY
          python services/vivo/tests/remote/browser_phone_engine_smoke.py             http://127.0.0.1:9877/ phone-engine-evidence/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-phone-engine-browser-smoke
          path: phone-engine-evidence/
          retention-days: 7
      - name: Scope
        run: echo 'Managed Chromium proves browser-local Worker/IndexedDB/agent behavior, not a physical-phone GPU/camera or Android-native permission run.'
