name: Vivo living encounters
on:
  pull_request:
    paths:
      - 'services/vivo/web/phone/**'
      - 'services/vivo/web/vivo-sw.js'
      - '.github/workflows/vivo-living-encounters.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encounters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser checks
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Original phone tests including encounters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encounter-evidence
          git rev-parse HEAD > encounter-evidence/source-commit.txt
          node --check services/vivo/web/phone/client.mjs
          node --test services/vivo/web/phone/tests/*.test.mjs | tee encounter-evidence/phone.tap
      - name: Real worker, object responses and IndexedDB history
        run: python services/vivo/web/phone/tests/browser_living_encounters.py
      - name: Historical offline upgrades and new encounter cache
        shell: bash
        run: |
          set -euo pipefail
          python services/vivo/web/phone/tests/browser_service_worker_upgrade.py | tee encounter-evidence/upgrade.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivo-living-encounters-evidence
          path: encounter-evidence/
          retention-days: 14
