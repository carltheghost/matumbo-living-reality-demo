name: Surface Semantic Field CI

on:
  push:
    branches:
      - feature/ssf-surface-native
  pull_request:
    paths:
      - 'src/domains/surface-semantic-field.js'
      - 'src/render/surface-semantic-field-three.js'
      - 'src/render/surface-semantic-field-lab.js'
      - 'src/domains/topology-semantic-field.js'
      - 'src/render/topology-surface-object.js'
      - 'surface-field.html'
      - 'tests/surface-semantic-field*.test.mjs'
      - '.github/workflows/ssf-ci.yml'

permissions:
  contents: read

jobs:
  ssf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/domains/surface-semantic-field.js
          node --check src/render/surface-semantic-field-three.js
          node --check src/render/surface-semantic-field-lab.js
          node --check src/domains/topology-semantic-field.js
          node --check src/render/topology-surface-object.js
      - name: Surface Semantic Field tests
        run: node --test tests/surface-semantic-field.test.mjs tests/surface-semantic-field-three.test.mjs tests/topology-semantic-field.test.mjs tests/topology-surface-object.test.mjs
