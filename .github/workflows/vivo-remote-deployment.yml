name: Vivo opt-in remote deployment recipe

on:
  pull_request:
    paths:
      - '.github/workflows/vivo-remote-deployment.yml'
      - 'services/vivo/Dockerfile.remote'
      - 'services/vivo/Caddyfile.remote'
      - 'services/vivo/compose.remote.yaml'
      - 'services/vivo/.dockerignore'
      - 'services/vivo/start-canonical-remote.sh'
      - 'services/vivo/requirements.txt'
      - 'services/vivo/server/**'
      - 'services/vivo/web/**'
      - 'services/vivo/contracts/**'
      - 'services/vivo/models/**'
      - 'services/vivo_adaptive/**'
      - 'services/vivo_material/**'
      - 'research/vivo-phase-fabric/web/target-mailbox.mjs'
      - 'services/vivo/tests/remote/**'
      - 'services/vivo/docs/REMOTE-DEPLOYMENT*'
      - 'scripts/vivo/verify_source_import.py'
      - 'services/vivo/scripts/verify_integrity.py'
      - 'services/vivo/source-import.json'

permissions:
  contents: read

jobs:
  recipe-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic remote test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            --no-cache-dir --requirement services/vivo/requirements.txt
      - name: Frozen source and package integrity
        run: |
          set -euo pipefail
          python scripts/vivo/verify_source_import.py
          python services/vivo/scripts/verify_integrity.py
          PYTHONPATH="$PWD/scripts/vivo" python -m unittest scripts/vivo/test_source_import.py -v
      - name: Remote deployment contract tests
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python -m unittest discover \
            -s services/vivo/tests/remote -p 'test_*.py' -v
      - name: Scope
        run: echo 'Recipe, immutable-source and negative-fixture validation only; no image push, credentials, provider call or public deployment.'

  image-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Build the remote image locally only
        run: |
          set -euo pipefail
          docker build --pull --file services/vivo/Dockerfile.remote \
            --tag "vivo-remote:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" .
      - name: Start, health-check, exercise disabled conversation, and stop on runner loopback
        shell: bash
        run: |
          set -euo pipefail
          image="vivo-remote:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="vivo-remote-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="vivo-remote-ci-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          port=18768
          container_port=8768
          origin="https://127.0.0.1:${port}"
          fixture_dir="$(mktemp -d)"
          # Deliberately nonsecret, ephemeral fixture material. It is never
          # persisted, uploaded, or used outside this runner-local container.
          owner_token='ci-fixture-owner-0123456789abcdef0123456789'
          result=0
          cleanup() {
            result=$?
            if docker inspect "$container" >/dev/null 2>&1; then
              docker stop --time 30 "$container" >/dev/null 2>&1 || true
              if [ "$result" -ne 0 ]; then
                docker logs "$container" 2>&1 | sed "s/${owner_token}/[fixture-redacted]/g" || true
              fi
              docker rm -f "$container" >/dev/null 2>&1 || true
            fi
            docker volume rm "$volume" >/dev/null 2>&1 || true
            rm -rf "$fixture_dir"
            exit "$result"
          }
          trap cleanup EXIT

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$fixture_dir/ca.key" -out "$fixture_dir/ca.pem" \
            -subj '/CN=Vivo CI CA' >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$fixture_dir/server.key" -out "$fixture_dir/server.csr" \
            -subj '/CN=vivo-remote' >/dev/null 2>&1
          printf '%s\n' 'subjectAltName=DNS:vivo-remote,IP:127.0.0.1' \
            > "$fixture_dir/server.ext"
          openssl x509 -req -in "$fixture_dir/server.csr" \
            -CA "$fixture_dir/ca.pem" -CAkey "$fixture_dir/ca.key" -CAcreateserial \
            -out "$fixture_dir/server.pem" -days 1 -sha256 \
            -extfile "$fixture_dir/server.ext" >/dev/null 2>&1
          # The image runs as UID 10001; these files are disposable CI fixtures,
          # not credentials, so the mounted key must be readable by that UID.
          chmod 0644 "$fixture_dir"/*
          chmod 0755 "$fixture_dir"

          docker run --rm --network none --entrypoint caddy \
            --env VIVA_DOMAIN=remote.example.test \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/services/vivo/Caddyfile.remote,dst=/etc/caddy/Caddyfile,readonly" \
            --mount "type=bind,src=${fixture_dir}/ca.pem,dst=/run/secrets/vivo_backend_ca,readonly" \
            caddy:2 validate --config /etc/caddy/Caddyfile --adapter caddyfile

          docker volume create "$volume" >/dev/null
          # Publish only the runner loopback. The service itself exercises the
          # production non-loopback TLS bind; no public listener is created.
          docker run --detach --name "$container" --init \
            --publish "127.0.0.1:${port}:${container_port}" \
            --mount "type=volume,src=${volume},dst=/data" \
            --mount "type=bind,src=${fixture_dir},dst=/run/fixture,readonly" \
            --env VIVO_OWNER_TOKEN="$owner_token" \
            --env OPENAI_API_KEY= \
            "$image" \
            --host 0.0.0.0 --port "$container_port" --data-dir /data \
            --origin "$origin" --store posix \
            --cert /run/fixture/server.pem --key /run/fixture/server.key >/dev/null

          python - "$origin" "$owner_token" "$fixture_dir/ca.pem" <<'PY'
          import json
          import ssl
          import sys
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          origin, owner, ca_file = sys.argv[1:]
          context = ssl.create_default_context(cafile=ca_file)
          health_url = origin + '/healthz'
          deadline = time.monotonic() + 90
          last = None
          while time.monotonic() < deadline:
              try:
                  with urlopen(health_url, context=context, timeout=3) as response:
                      body = json.load(response)
                  if response.status == 200 and body.get('ok') is True:
                      break
                  last = body
              except Exception as error:
                  last = f'{type(error).__name__}: {error}'
              time.sleep(.5)
          else:
              raise SystemExit(f'container health timeout: {last!r}')

          headers = {'Origin': origin, 'Authorization': 'Bearer ' + owner}
          status_request = Request(origin + '/api/conversation/status', headers=headers)
          with urlopen(status_request, context=context, timeout=5) as response:
              status = json.load(response)
          assert status['available'] is False, status
          assert status['reason'] == 'provider-not-configured', status

          body = b'{"sessionId":"ci-session","requestId":"ci.1"}'
          respond_request = Request(
              origin + '/api/conversation/respond', data=body,
              headers={**headers, 'Content-Type': 'application/json'}, method='POST')
          try:
              urlopen(respond_request, context=context, timeout=5)
          except HTTPError as error:
              assert error.code == 503, error
              response = json.load(error)
              assert response['error'] == 'CONVERSATION_UNAVAILABLE', response
          else:
              raise AssertionError('disabled conversation unexpectedly succeeded')
          print('loopback health and provider-disabled conversation passed')
          PY

          docker stop --time 30 "$container" >/dev/null
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container")"
          test "$exit_code" = 0
          echo "graceful container shutdown passed with exit code ${exit_code}"
      - name: Scope
        run: echo 'Local image build and runner-loopback health/shutdown smoke only; no image push, secrets, persistent tokens, public port, TLS deployment or live provider call.'
